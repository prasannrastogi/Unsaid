name: Build Unsaid v3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Unsaid v3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Unsaid Project
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "Unsaid_Android_Studio_Project_v3/settings.gradle" ] && [ -f "Unsaid_Android_Studio_Project_v3/app/build.gradle" ]; then
            echo "dir=Unsaid_Android_Studio_Project_v3" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Android project files not found."
            echo "Upload the extracted v3 project files to the repository."
            exit 1
          fi

      - name: Verify Unsaid v3 Files
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml
          echo "Project files verified."

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload Unsaid v3 APK
        uses: actions/upload-artifact@v4
        with:
          name: Unsaid-v3-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
